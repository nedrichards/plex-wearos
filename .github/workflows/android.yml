name: Android checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Verify tests, lint, debug and release builds
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease
      - name: Upload installable debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plex-wearos-debug-${{ github.sha }}
          path: '**/build/outputs/apk/**/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
      - name: Summarize verification
        if: always()
        run: python3 .github/scripts/verification-summary.py
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload release build APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-apks-${{ github.sha }}
          path: '**/build/outputs/apk/**/release/*.apk'
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft development APK release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '*debug*'
          path: artifacts
      - name: Prepare labelled APKs and checksums
        run: |
          mkdir release-apks
          python3 - <<'SCRIPT'
          from pathlib import Path
          import shutil
          for apk in Path('artifacts').rglob('*.apk'):
              name = '-'.join(apk.relative_to('artifacts').parts)
              shutil.copy2(apk, Path('release-apks') / name)
          if not list(Path('release-apks').glob('*.apk')):
              raise SystemExit('No debug APKs were downloaded')
          SCRIPT
          cd release-apks
          sha256sum *.apk > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-apks/* --verify-tag --draft \
            --title "$RELEASE_TAG development APKs" \
            --notes "Verified debug APKs for installation and testing. Signed with a disposable CI debug key; updates from other builds may require reinstalling. Production-signed distribution requires the app's release keystore and versioning procedure. SHA256SUMS is attached."
